<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾词 · 单词背诵</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ec;color:#244436;font:16px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:28px 18px}small,footer{color:#788575}h1{font-size:32px}button,select,input{font:inherit;padding:14px;border:1px solid #dce1d5;border-radius:12px;background:white;color:inherit;margin:4px;max-width:100%}button{cursor:pointer;touch-action:manipulation}.green{background:#285b45;color:white}.card{margin:22px 0;background:#fffef9;border:1px solid #e0e2d5;border-radius:26px;padding:35px 18px;text-align:center;min-height:300px}h2{font:clamp(28px,8vw,48px) Georgia;overflow-wrap:anywhere}#meaning{font-size:22px;min-height:60px}.actions{display:flex}.actions>*{flex:1}progress{width:100%;accent-color:#376b49}footer{font-size:12px;line-height:1.8;margin-top:28px}article{background:white;padding:15px;border-radius:12px;margin:8px 0}article b{display:inline-block;min-width:45%}[hidden]{display:none!important}</style><main><small>SHICI / 你的专属词库</small><h1>每天，记住一点。</h1><p id="stats"></p><progress id="progress"></progress><nav><button class="green" onclick="mode=0;show()">翻卡背诵</button><button onclick="mode=1;show()">拼写练习</button><button onclick="mode=2;show()">词汇总览</button></nav><select id="group" aria-label="图片分组" onchange="start()"><option value="0">全部图片</option><option value="1">图片 1</option><option value="2">图片 2</option><option value="3">图片 3</option><option value="4">图片 4</option><option value="5">图片 5</option><option value="6">图片 6</option><option value="7">图片 7</option></select><select id="scope" aria-label="学习范围" onchange="start()"><option value="all">全部单词</option><option value="hard">生词本</option><option value="new">未掌握</option></select><button onclick="shuffle()">打乱顺序</button><p id="pos"></p><section class="card" id="card"><small id="tag"></small><h2 id="word"></h2><p id="meaning"></p><div id="spell"><input id="answer" placeholder="输入英文" aria-label="英文拼写" autocomplete="off" autocapitalize="off" spellcheck="false"><button onclick="check()">检查</button></div><p id="msg" role="status"></p><button onclick="reveal=true;show()">查看答案</button><button onclick="speak()">♫ 发音</button></section><div id="actions" class="actions"><button onclick="mark('hard')">还不熟</button><button class="green" onclick="mark('known')">记住了 ✓</button></div><div class="actions"><button onclick="move(-1)">← 上一个</button><button onclick="move(1)">下一个 →</button></div><section id="list" hidden><input id="search" oninput="listing()" placeholder="搜索中英文" aria-label="搜索"><div id="rows"></div></section><footer>根据你的 7 张图片整理，共 107 词。记录保存在当前浏览器，设备间不自动同步。发音需要系统支持。<br><button onclick="backup()">备份记录</button><button onclick="E('file').click()">恢复记录</button><input id="file" type="file" accept="application/json" hidden onchange="restore(this)"></footer></main><script>const words=[["boom", "繁荣", 1], ["cite", "引用，引证", 1], ["considerably", "相当地", 1], ["beverage", "饮料", 1], ["environmentally", "从环境角度", 1], ["manufacturing", "制造业，生产", 1], ["surprising", "令人惊讶的", 1], ["cafe", "咖啡馆", 1], ["slip", "滑倒", 1], ["tremendous", "巨大的", 1], ["volume", "音量", 1], ["judge", "判断，评判", 2], ["meanwhile", "与此同时", 2], ["roughly", "大约，大概", 2], ["urban", "城市的，都市的", 2], ["actual", "真实的", 2], ["combat", "战斗", 2], ["ease", "容易", 2], ["obvious", "明显的", 2], ["wildlife", "野生动植物", 2], ["recycling", "回收利用", 2], ["rarely", "很少，难得，不常", 2], ["adviser", "顾问", 2], ["broad", "宽阔的", 2], ["estate", "地产", 2], ["shoot", "射击", 2], ["slowly", "缓慢地", 2], ["define", "给……下定义", 3], ["install", "安装", 3], ["ultimately", "最终，终归", 3], ["entirely", "完全地", 3], ["gather", "聚集，集合", 3], ["political", "政治的", 3], ["stuff", "东西", 3], ["collection", "收集物", 3], ["multiple", "多个的", 3], ["slightly", "稍微，略微，轻微地", 3], ["advocate", "拥护", 3], ["portion", "部分", 3], ["alternative", "可供选择的事物", 3], ["annual", "每年的，年度的", 3], ["clearly", "清楚地，明白地", 3], ["initiative", "主动性", 3], ["case", "情况", 4], ["according", "根据", 4], ["amount", "数量", 4], ["least", "最少的", 4], ["argue", "争论", 4], ["obesity", "肥胖（症）", 4], ["damage", "损害", 4], ["struggle", "奋斗", 4], ["increasingly", "越来越，日益，不断增加地", 4], ["various", "各种各样的", 4], ["nation", "国家", 4], ["demand", "坚决要求", 4], ["innovation", "创新，革新", 4], ["per", "每", 4], ["variety", "多样化", 4], ["boost", "提高", 4], ["numerous", "众多的，许多的", 5], ["elsewhere", "在别处", 5], ["latest", "最新的", 5], ["recycled", "回收利用的", 5], ["fancy", "想要", 5], ["pace", "速度", 5], ["campaigner", "活动家，运动倡导者", 5], ["sugary", "含糖的", 5], ["accord", "（国家、团体间的）协议", 5], ["system", "系统", 5], ["customer", "顾客，客户", 5], ["million", "一百万", 5], ["support", "支持", 5], ["lack", "缺少", 5], ["type", "类型", 5], ["base", "基础", 5], ["event", "事件", 6], ["consume", "消耗，耗费", 6], ["tax", "税", 6], ["available", "可获得的", 6], ["exist", "存在，实际上有", 6], ["consumption", "消费", 6], ["adapt", "适应，适合", 6], ["billion", "十亿", 6], ["launch", "推出", 6], ["manufacturer", "制造商", 6], ["aware", "知道的", 6], ["fuel", "燃料", 6], ["brand", "品牌，商标", 6], ["fossil", "化石", 6], ["profit", "利润，盈利", 6], ["property", "财产", 6], ["bottled", "瓶装的", 7], ["ban", "禁止", 7], ["tap", "轻敲，轻拍", 7], ["concern", "涉及", 7], ["awareness", "意识", 7], ["rate", "速度", 7], ["analyst", "分析师", 7], ["consumer", "消费者", 7], ["range", "范围", 7], ["environmental", "环境的", 7], ["marketing", "营销", 7], ["recycle", "回收利用（废品）", 7], ["product", "产品", 7], ["challenge", "挑战", 7], ["growth", "增长", 7], ["data", "数据", 7]],E=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('shici')||'{}')}catch(e){}let q=[],i=0,mode=0,reveal=false;function save(){try{localStorage.setItem('shici',JSON.stringify(state))}catch(e){E('msg').textContent='无法保存，请备份记录'}}function start(){q=words.filter(w=>(!+E('group').value||w[2]===+E('group').value)&&(E('scope').value==='all'||(E('scope').value==='hard'?state[w[0]]==='hard':state[w[0]]!=='known')));i=0;reveal=false;show()}function show(){let n=words.filter(w=>state[w[0]]==='known').length;E('stats').textContent=words.length+' 个单词 · 已掌握 '+n+' · 生词 '+words.filter(w=>state[w[0]]==='hard').length;E('progress').max=words.length;E('progress').value=n;let w=q[i];E('pos').textContent=q.length?(i+1)+' / '+q.length:'当前范围暂无单词';E('card').hidden=mode===2;E('actions').hidden=mode===2||!w;E('list').hidden=mode!==2;E('spell').hidden=mode!==1||!w;E('tag').textContent=w?'图片 '+w[2]+' · '+(state[w[0]]==='known'?'已掌握':state[w[0]]==='hard'?'生词':'待学习'):'';E('word').textContent=w?(mode===1&&!reveal?'回想英文拼写':w[0]):'完成啦';E('meaning').textContent=w?(reveal||mode===1?w[1]:'先想一想，再查看答案'):'切换范围继续学习';E('msg').textContent='';if(mode===2)listing()}function move(d){if(!q.length)return;i=(i+d+q.length)%q.length;reveal=false;E('answer').value='';show()}function mark(s){if(!q[i])return;state[q[i][0]]=s;save();if(E('scope').value!=='all'){q.splice(i,1);i%=Math.max(q.length,1);reveal=false;show()}else move(1)}function shuffle(){for(let k=q.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[q[k],q[j]]=[q[j],q[k]]}i=0;reveal=false;show()}function check(){if(!q[i])return;let ok=E('answer').value.trim().toLowerCase()===q[i][0];reveal=true;show();E('msg').textContent=ok?'拼对了！点击记住了继续。':'正确答案：'+q[i][0];if(!ok){state[q[i][0]]='hard';save()}}function speak(){if(!q[i])return;if(!window.speechSynthesis){E('msg').textContent='当前浏览器不支持发音';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q[i][0]);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function listing(){E('rows').replaceChildren();q.filter(w=>(w[0]+w[1]).toLowerCase().includes(E('search').value.toLowerCase())).forEach(w=>{let a=document.createElement('article'),b=document.createElement('b');b.textContent=w[0];a.append(b,document.createTextNode(w[1]));E('rows').append(a)})}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='拾词记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(f){if(!f.files[0])return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||Array.isArray(x))throw 0;state=Object.fromEntries(Object.entries(x).filter(([k,v])=>words.some(w=>w[0]===k)&&['known','hard'].includes(v)));save();start()}catch(e){alert('记录格式错误')}};r.readAsText(f.files[0])}E('answer').onkeydown=e=>{if(e.key==='Enter')check()};start();</script></html>
